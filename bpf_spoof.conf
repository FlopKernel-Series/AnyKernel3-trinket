# pattern matching: fixed-string by default; prefix pattern with
#   re:     => treat as extended regex (grep -E)
#   ire:    => treat as extended regex, case-insensitive (grep -Ei)
#   if:     => treat as fixed string, case-insensitive (grep -Fi)
